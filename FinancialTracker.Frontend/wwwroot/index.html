<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="recaptcha-sitekey" content="6LcBsJ4rAAAAABVjRHjsP5K0pXVZbCm_ipxSGutn">
    <title>FinancialTracker.Frontend</title>
    <base href="/" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="FinancialTracker.Frontend.styles.css" rel="stylesheet" />
    <script src="https://www.google.com/recaptcha/api.js?" async defer></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
    <script>
        window.localStorageWrapper = {
            setItem: (key, value) => localStorage.setItem(key, value),
            getItem: (key) => localStorage.getItem(key),
            removeItem: (key) => localStorage.removeItem(key)
        };
    </script>
    <script src="js/recaptcha.js"></script>
</body>

</html>
