services:
  financialtracker.services.authorizeapi:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=5000
      - ASPNETCORE_HTTPS_PORTS=5001
      - ASPNETCORE_URLS=http://+:5010
    
    ports:
      - "5010:5010"
      - "5001"
    volumes:
      - ~/.aspnet/https:/https:ro